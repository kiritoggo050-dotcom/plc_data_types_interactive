<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตัวแปรและประเภทข้อมูลสำหรับระบบ PLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════ Design Tokens ═══════════════════ */
:root{
  --bg:#f7f8fa;--card:#ffffff;--ink:#1a1d21;--sub:#5e6368;--mute:#8c9196;
  --line:#e3e5e8;--acc:#1a73e8;--acc2:#174ea6;--acc-bg:#e8f0fe;
  --ok:#1e8e3e;--ok-bg:#e6f4ea;--warn:#f9ab00;--warn-bg:#fef7e0;
  --bad:#d93025;--bad-bg:#fce8e6;--led:#f9ab00;--led-glow:rgba(249,171,0,.35);
  --radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-lg:0 4px 12px rgba(0,0,0,.1);
  color-scheme:light
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1a1d21;--card:#25292e;--ink:#e8eaed;--sub:#9aa0a6;--mute:#6b7075;
  --line:#3c4043;--acc:#8ab4f8;--acc2:#aecbfa;--acc-bg:#1e3a5f;
  --ok:#81c995;--ok-bg:#1b3626;--warn:#fdd663;--warn-bg:#3e3214;
  --bad:#f28b82;--bad-bg:#3c1f1e;--led:#fdd663;--led-glow:rgba(253,214,99,.3);
  --shadow:0 1px 3px rgba(0,0,0,.3);--shadow-lg:0 4px 12px rgba(0,0,0,.4);
  color-scheme:dark
}}

/* ═══════════════════ Reset & Base ═══════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;padding-top:env(safe-area-inset-top,0)}
body{background:var(--bg);color:var(--ink);font:400 15px/1.7 Prompt,"Noto Sans Thai",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

/* ═══════════════════ Layout ═══════════════════ */
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

/* ═══════════════════ Header ═══════════════════ */
.site-header{padding:28px 0 20px;border-bottom:1px solid var(--line)}
.site-header h1{font-size:1.5rem;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.site-header .meta{color:var(--sub);font-size:.82rem;margin-top:4px;display:flex;flex-wrap:wrap;gap:6px 16px}
.site-header .meta span::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--acc);margin-right:6px;vertical-align:middle}

/* ═══════════════════ Progress Bar ═══════════════════ */
.progress-wrap{padding:14px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.progress-bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress-bar b{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .4s ease}
.progress-label{font-size:.78rem;color:var(--sub);white-space:nowrap;min-width:80px;text-align:right}

/* ═══════════════════ Nav Tabs ═══════════════════ */
.nav-tabs{display:flex;flex-wrap:wrap;gap:6px;padding:14px 0;position:sticky;top:0;background:var(--bg);z-index:10}
.tab{white-space:nowrap;border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:500 .82rem/1 Prompt,sans-serif;cursor:pointer;background:var(--card);color:var(--sub);transition:all .15s ease;display:flex;align-items:center;gap:6px;user-select:none}
.tab:hover{border-color:var(--acc);color:var(--acc)}
.tab.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.tab .check{font-size:.7rem;opacity:.6}
/* Nav arrows */
.nav-arrows{display:flex;gap:8px;justify-content:space-between;margin:8px 0 4px}
.nav-arrow{font:500 .85rem/1 Prompt,sans-serif;padding:10px 18px;border-radius:8px;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink);transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.nav-arrow:hover{border-color:var(--acc);color:var(--acc)}
.nav-arrow:disabled{opacity:.3;cursor:default;border-color:var(--line);color:var(--mute)}

/* ═══════════════════ Content ═══════════════════ */
main{padding:8px 0 60px}
h2{font-size:1.25rem;font-weight:600;margin:20px 0 6px;display:flex;align-items:center;gap:8px}
h2 .ico{font-size:1.1rem}
h3{font-size:1rem;font-weight:600;margin:20px 0 6px;color:var(--ink)}
p,.desc{color:var(--sub);font-size:.9rem;line-height:1.65;margin:4px 0 12px}

/* Card */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card-flat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:10px 0}

/* Key Takeaway */
.takeaway{background:var(--acc-bg);border:1px solid var(--acc);border-radius:var(--radius);padding:14px 16px;margin:16px 0;font-size:.88rem;line-height:1.6}
.takeaway b{color:var(--acc);font-weight:600}
.takeaway::before{content:"💡";margin-right:6px}

/* Grid cards */
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.grid4 .gc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:4px;transition:box-shadow .15s}
.grid4 .gc:hover{box-shadow:var(--shadow-lg)}
.gc b{font-size:.95rem}.gc small{color:var(--sub);font-size:.8rem}
.gc .bar{height:8px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.gc .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:4px}

/* Output box */
.out{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:12px 14px;margin:10px 0;font-family:"Fira Code","Courier New",monospace;font-size:.88rem;overflow-x:auto;line-height:1.65}

/* Table */
.tw{overflow-x:auto;margin:10px 0;border-radius:var(--radius);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
thead{background:var(--acc-bg)}
th{padding:10px 12px;text-align:left;font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;color:var(--acc);border-bottom:2px solid var(--line)}
td{padding:8px 12px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--acc-bg)}
td.m,.mono{font-family:"Fira Code","Courier New",monospace}

/* Bits */
.bits{display:flex;gap:16px;flex-wrap:wrap}
.byte-group{display:flex;gap:4px;flex-wrap:wrap}
.byte-group p{flex-basis:100%;margin:0;font-size:.78rem;color:var(--sub);font-weight:500}
.bit{width:44px;height:56px;padding:0;font-family:"Fira Code","Courier New",monospace;font-weight:700;font-size:.95rem;border-radius:8px;cursor:pointer;transition:all .15s;background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.bit:hover{border-color:var(--acc);transform:translateY(-1px)}
.bit small{display:block;font-size:.6rem;font-weight:400;color:var(--mute)}
.bit.on{background:var(--led);color:#1a1d21;border-color:var(--led);box-shadow:0 0 10px var(--led-glow)}

/* ASCII grid */
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:3px}
.gr button{padding:4px 0;font-family:"Fira Code","Courier New",monospace;font-size:.85rem;border-radius:6px;background:var(--card);border:1px solid var(--line);cursor:pointer;color:var(--ink);transition:all .1s}
.gr button:hover{background:var(--acc-bg);border-color:var(--acc)}

/* Memory cells */
.cell{display:inline-block;width:68px;text-align:center;border:1.5px solid var(--line);padding:6px 0;font-family:"Fira Code","Courier New",monospace;font-size:.8rem;border-radius:6px;transition:all .15s;margin:2px}
.cell.on{background:var(--acc);color:#fff;border-color:var(--acc)}

/* LED */
.led{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--line);vertical-align:middle;transition:all .2s}
.led.on{background:var(--led);box-shadow:0 0 10px var(--led-glow)}

/* Bar progress */
.bar-anim{height:14px;background:var(--line);border-radius:7px;overflow:hidden}
.bar-anim b{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:7px}

/* Status chips */
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.chip-ok{background:var(--ok-bg);color:var(--ok);font-size:.8rem;padding:2px 10px;border-radius:12px;font-weight:500}
.chip-bad{background:var(--bad-bg);color:var(--bad);font-size:.8rem;padding:2px 10px;border-radius:12px;font-weight:500}

/* Options / Quiz */
.opts{display:grid;gap:8px}
.opts button{text-align:left;padding:12px 16px;border-radius:10px;font-size:.9rem;background:var(--card);border:1.5px solid var(--line);cursor:pointer;color:var(--ink);transition:all .15s;line-height:1.4}
.opts button:hover:not(:disabled){border-color:var(--acc);background:var(--acc-bg)}
.opts button.sel{background:var(--acc);color:#fff;border-color:var(--acc)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opts button:disabled{opacity:.7;cursor:default}

/* Buttons */
.btn{font:500 .88rem/1 Prompt,sans-serif;padding:10px 20px;border-radius:8px;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--acc);color:#fff}.btn-primary:hover{background:var(--acc2)}
.btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--ink)}.btn-outline:hover{border-color:var(--acc);color:var(--acc)}
.btn-sm{padding:6px 14px;font-size:.82rem;border-radius:6px}

/* Inputs */
input[type="range"]{accent-color:var(--acc)}
input[type="number"],input[type="text"],select{font:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--ink);transition:border-color .15s}
input:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-bg)}
input[type="checkbox"]{accent-color:var(--acc);width:18px;height:18px;cursor:pointer}
label{cursor:pointer;font-size:.9rem;display:flex;align-items:center;gap:8px}

/* Footer */
footer{text-align:center;color:var(--mute);font-size:.78rem;padding:20px 16px 32px;border-top:1px solid var(--line);margin-top:24px}

/* Animations */
@media(prefers-reduced-motion:no-preference){
  .bar-anim b{transition:width .3s ease}
  .fade-in{animation:fadeIn .3s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
  .pop{animation:pop .3s ease}
}

/* ═══════════════════ Responsive ═══════════════════ */
@media(max-width:600px){
  .site-header h1{font-size:1.2rem}
  .grid4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .bit{width:38px;height:48px;font-size:.85rem}
  .cell{width:56px;font-size:.72rem}
  .tab{padding:6px 10px;font-size:.75rem}
  .nav-arrow{padding:8px 12px;font-size:.8rem}
}
@media print{
  body{background:#fff;color:#000}
  .nav-tabs,.nav-arrows,.progress-wrap,.no-print{display:none!important}
  .card,.card-flat,.tw{box-shadow:none;border-color:#ccc}
  .wrap{max-width:100%;padding:0}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="site-header">
    <h1>ตัวแปรและประเภทข้อมูลสำหรับระบบ PLC</h1>
    <div class="meta">
      <span>สื่อการเรียนรู้แบบปฏิสัมพันธ์ 8 โมดูล</span>
      <span>รายวิชาโปรแกรมเมเบิลลอจิกคอนโทรล (20105-2006)</span>
    </div>
  </header>

  <div class="progress-wrap">
    <div class="progress-bar"><b id="pbar" style="width:0"></b></div>
    <div class="progress-label" id="plabel">0 / 8 โมดูล</div>
  </div>

  <nav class="nav-tabs" id="n" aria-label="โมดูลการเรียนรู้"></nav>
  <main id="m"></main>
  <div class="nav-arrows" id="navarr"></div>

  <footer>วิทยาลัยการอาชีพบางปะกง · แผนกแมคคาทรอนิกส์และหุ่นยนต์</footer>
</div>

<script>
/* ═══════════════════ Utilities ═══════════════════ */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const f=n=>n.toLocaleString("en-US"),hx=(n,l=2)=>n.toString(16).toUpperCase().padStart(l,"0");
const wrap=(x,b)=>((x+2**(b-1))%2**b+2**b)%2**b-2**(b-1);
let tm=null,seen=new Set();

/* ═══════════════════ Module Registry ═══════════════════ */
const M=[
  ["พื้นฐาน 101","📐",m1],
  ["คลังชนิดข้อมูล","📦",m2],
  ["ตัวช่วยเลือก","🧭",m3],
  ["ล็อกเกอร์ 16-Bit","🔢",m4],
  ["ASCII & String","🔤",m5],
  ["เทียบแบรนด์ PLC","🔀",m6],
  ["Timer & Counter","⏱️",m7],
  ["แบบทดสอบ","📝",m8]
];

function updateProgress(){
  const pct=seen.size/M.length*100;
  $("#pbar").style.width=pct+"%";
  $("#plabel").textContent=`${seen.size} / ${M.length} โมดูล`;
}

let curMod=0;
function go(i){
  clearInterval(tm);curMod=i;seen.add(i);updateProgress();
  $("#n").innerHTML=M.map((x,j)=>`<button class="tab ${j==i?"active":""}" onclick="go(${j})" aria-label="โมดูล ${j+1}: ${x[0]}">${x[1]} ${j+1}. ${x[0]}${seen.has(j)&&j!=i?' <span class="check">✓</span>':""}</button>`).join("");
  // Nav arrows
  const prevBtn=i>0?`<button class="nav-arrow" onclick="go(${i-1})">← ${M[i-1][0]}</button>`:`<button class="nav-arrow" disabled>← ก่อนหน้า</button>`;
  const nextBtn=i<M.length-1?`<button class="nav-arrow" onclick="go(${i+1})">${M[i+1][0]} →</button>`:`<button class="nav-arrow" disabled>ถัดไป →</button>`;
  $("#navarr").innerHTML=prevBtn+nextBtn;
  M[i][2]($("#m"));scrollTo({top:0,behavior:"smooth"});
}

/* ═══════════════════ M1: พื้นฐาน 101 ═══════════════════ */
function m1(e){
  e.innerHTML=`<div class="fade-in">
<h2><span class="ico">📐</span> ทำไมต้องมีชนิดข้อมูล</h2>
<p>หน่วยความจำของ PLC เก็บเป็น<b>บิต</b> (0 หรือ 1) ชนิดข้อมูลบอกว่าจะใช้กี่บิตและตีความค่าอย่างไร — ใช้บิตมากเก็บค่าได้ช่วงกว้าง แต่กินหน่วยความจำมากขึ้น</p>

<div class="grid4">${[
  ["BOOL","สวิตช์ ON/OFF",1,"เช่น เซนเซอร์ตรวจจับชิ้นงาน"],
  ["BYTE / SINT","กล่องเล็ก 8 บิต",8,"เช่น กลุ่มสถานะ 8 จุด"],
  ["INT / WORD","กล่องกลาง 16 บิต",16,"เช่น นับชิ้นงาน ค่า Timer"],
  ["DINT / REAL","กล่องใหญ่ 32 บิต",32,"เช่น ค่าอนาล็อก อุณหภูมิ"]
].map(a=>`<div class="gc">
  <b>${a[0]}</b><small>${a[1]}</small>
  <div class="bar"><i style="width:${a[2]*3}%"></i></div>
  <span style="font-size:.82rem;color:var(--acc);font-weight:500">${a[2]} บิต</span>
  <small>${a[3]}</small>
</div>`).join("")}</div>

<div class="card">
  <label style="font-weight:500">ลองเลื่อนจำนวนบิต: <b id="nb" style="color:var(--acc)">8</b> บิต
    <input type="range" id="r" min="1" max="32" value="8" style="flex:1;min-width:120px">
  </label>
  <div id="o" class="out" style="margin-top:10px"></div>
</div>

<h3>🏭 ตัวอย่างการประยุกต์ใช้จริง</h3>
<div class="card-flat">
  <p style="margin:0"><b>โจทย์:</b> โรงงานต้องนับชิ้นงานได้ถึง 50,000 ชิ้น ควรใช้ตัวแปรชนิดใด?</p>
  <div class="out" style="margin-top:8px">
    ❌ INT (16 บิต) → เก็บได้สูงสุด 32,767 → <span class="bad">ไม่พอ! ค่าล้น</span><br>
    ❌ UINT (16 บิต) → เก็บได้สูงสุด 65,535 → พอ แต่ถ้าขยายภายหลัง?<br>
    ✅ <b>DINT (32 บิต)</b> → เก็บได้ถึง 2,147,483,647 → <span class="ok">ปลอดภัย เผื่ออนาคต</span>
  </div>
</div>

<div class="takeaway"><b>Key Takeaway:</b> เลือกชนิดข้อมูลให้พอดีกับงาน — เล็กเกินไปค่าล้น ใหญ่เกินไปเปลืองหน่วยความจำ</div>
</div>`;

  const u=()=>{const n=+$("#r").value,p=2**n;
    $("#nb").textContent=n;
    $("#o").innerHTML=`แทนค่าได้ 2<sup>${n}</sup> = <b>${f(p)}</b> ค่า<br>ไม่มีเครื่องหมาย: <b>0</b> ถึง <b>${f(p-1)}</b><br>มีเครื่องหมาย: <b>${f(-p/2)}</b> ถึง <b>${f(p/2-1)}</b>`};
  $("#r").oninput=u;u();
}

/* ═══════════════════ M2: คลังชนิดข้อมูล ═══════════════════ */
const T=[
  ["BOOL","1","0 / 1","สัญญาณ ON/OFF เช่น สวิตช์ เซนเซอร์","r"],
  ["BYTE","8","16#00 ถึง 16#FF","กลุ่มบิต 8 จุด","r"],
  ["WORD","16","16#0000 ถึง 16#FFFF","กลุ่มบิต 16 จุด","r"],
  ["DWORD","32","16#0 ถึง 16#FFFFFFFF","กลุ่มบิต 32 จุด","r"],
  ["SINT","8","-128 ถึง 127","จำนวนเต็มเล็ก (มีเครื่องหมาย)","i"],
  ["USINT","8","0 ถึง 255","จำนวนเต็มเล็ก ไม่ติดลบ","i"],
  ["INT","16","-32,768 ถึง 32,767","ตัวนับ ค่าตั้งทั่วไป","i"],
  ["UINT","16","0 ถึง 65,535","ค่าไม่ติดลบ","i"],
  ["DINT","32","±2,147,483,648","ตัวนับสะสมค่าสูง","i"],
  ["UDINT","32","0 ถึง 4,294,967,295","ค่าไม่ติดลบขนาดใหญ่","i"],
  ["LINT","64","±9.22×10¹⁸","จำนวนเต็มใหญ่มาก","i"],
  ["REAL","32","±3.4×10³⁸ (ละเอียด ~7 หลัก)","อนาล็อกที่แปลงหน่วยแล้ว เช่น 36.75 °C","d"],
  ["LREAL","64","±1.8×10³⁰⁸ (~15 หลัก)","คำนวณละเอียดสูง","d"],
  ["TIME","32","เช่น T#5s, T#1m30s","ค่าเวลาของ Timer","o"],
  ["STRING","8 ต่อตัวอักษร","ข้อความ ASCII","ชื่อสินค้า ข้อความแสดงผล","o"]
];

function m2(e){
  const C={"":"ทั้งหมด",r:"บิตและข้อมูลดิบ",i:"จำนวนเต็ม",d:"ทศนิยม",o:"เวลาและข้อความ"};
  const icons={"":"📋",r:"🔘",i:"🔢",d:"📊",o:"⏰"};
  e.innerHTML=`<div class="fade-in">
<h2><span class="ico">📦</span> คลังชนิดข้อมูลตามมาตรฐาน IEC 61131-3</h2>
<p>มาตรฐาน IEC 61131-3 กำหนดชนิดข้อมูลเพื่อให้ PLC ทุกแบรนด์ใช้ร่วมกันได้</p>

/* ═══════════════════ M4: ล็อกเกอร์ 16-Bit ═══════════════════ */
function m4(e){
  let v=0;
  e.innerHTML=`<div class="fade-in">
<h2><span class="ico">🔢</span> ล็อกเกอร์ความจำ 16-Bit Register</h2>
<p>คลิกบิตเพื่อสลับ 0/1 แล้วดูว่าค่าเปลี่ยนในแต่ละมุมมองอย่างไร — ทดลองกดจนเข้าใจว่าข้อมูลถูกจัดเก็บอย่างไรในหน่วยความจำ PLC</p>
<div id="bits" class="bits"></div>
<div class="card" style="display:flex;flex-wrap:wrap;align-items:center;gap:10px">
  <label style="flex:1;min-width:200px">ตั้งค่าฐานสิบ (0–65535)
    <input id="iv" type="number" min="0" max="65535" value="0" style="width:100%">
  </label>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn btn-outline btn-sm" id="p1">+1</button>
    <button class="btn btn-outline btn-sm" id="mx">ตั้ง 32767</button>
    <button class="btn btn-outline btn-sm" id="z">ล้าง 0</button>
  </div>
</div>
<div id="o" class="out"></div>
<div class="takeaway"><b>Key Takeaway:</b> Register 16 บิต แบ่งเป็น High Byte (บิต 15–8) และ Low Byte (บิต 7–0) ค่าเดียวกันแปลความหมายได้ทั้ง UINT (ไม่ติดลบ) และ INT (มีเครื่องหมาย)</div>
</div>`;

  const d=()=>{
    let h="";
    for(const[a,b,t]of[[15,8,"High Byte (บิต 15–8)"],[7,0,"Low Byte (บิต 7–0)"]]){
      h+=`<div class="byte-group"><p>${t}</p>`;
      for(let i=a;i>=b;i--)h+=`<button class="bit ${v>>i&1?"on":""}" data-i="${i}" aria-label="บิต ${i}"><small>${i}</small>${v>>i&1}</button>`;
      h+="</div>"
    }
    $("#bits").innerHTML=h;
    $$(".bit").forEach(b=>b.onclick=()=>{v^=1<<b.dataset.i;d()});
    $("#iv").value=v;
    const signed=v>32767?v-65536:v;
    $("#o").innerHTML=`<b>Low Byte</b> : ${v&255} (16#${hx(v&255)})<br><b>High Byte</b>: ${v>>8} (16#${hx(v>>8)})<br><b>WORD / UINT</b> : ${f(v)} (16#${hx(v,4)})<br><b>INT</b> (มีเครื่องหมาย): ${f(signed)} ${v>32767?`<span class="chip-bad">⚠ ค่าล้นจาก 32767!</span>`:""}`;
  };
  $("#iv").onchange=x=>{v=Math.max(0,Math.min(65535,+x.target.value|0));d()};
  $("#p1").onclick=()=>{v=(v+1)&65535;d()};
  $("#mx").onclick=()=>{v=32767;d()};
  $("#z").onclick=()=>{v=0;d()};
  d();
}

function m5(e){
  e.innerHTML=`<div class="fade-in">

<p>ตัวอักษร 1 ตัว = 1 ไบต์ (8 บิต) ดังนั้น Register 16 บิต 1 ตัวเก็บได้ 2 ตัวอักษร<br><small style="color:var(--mute)">(ตัวแรกอยู่ Low Byte แบบ Mitsubishi)</small></p>
<div class="card">
  <label style="font-weight:500">พิมพ์ข้อความ (ภาษาอังกฤษ)
    <input id="t" type="text" value="PLC1" maxlength="16" style="flex:1;min-width:140px">
  </label>
</div>
<div id="o"></div>
<h3>ตาราง ASCII 32–126 (คลิกดูรหัส)</h3>
<div id="gr" class="gr"></div>
<div id="gi" class="out">👆 คลิกอักขระเพื่อดูรหัส</div>
<div class="takeaway"><b>Key Takeaway:</b> ASCII ใช้ 7 บิตแทนอักขระ (0–127) — 'A'=65, 'a'=97, '0'=48 Register 16 บิต 1 ตัวเก็บได้ 2 ตัวอักษร</div>
</div>`;

  const sh=c=>`'${String.fromCharCode(c)}' = ฐานสิบ <b>${c}</b>, 16#${hx(c)}, ฐานสอง ${c.toString(2).padStart(8,"0")}`;
  const u=()=>{
    const s=[...$("#t").value],c=s.map(x=>x.charCodeAt(0)),bad=c.some(x=>x>127),k=c.map(x=>x>127?63:x);
    let h=`<div class="tw"><table><thead><tr><th>ตัวอักษร</th><th>ฐานสิบ</th><th>ฐานสิบหก</th><th>ฐานสอง</th></tr></thead><tbody>${s.map((x,i)=>`<tr><td class="m" style="font-size:1.1rem">${x}</td><td>${k[i]}</td><td class="m">${hx(k[i])}</td><td class="m">${k[i].toString(2).padStart(8,"0")}</td></tr>`).join("")}</tbody></table></div><div class="out">`;
    for(let i=0;i<k.length;i+=2){
      const a=k[i],b=k[i+1]||0;
      h+=`<b>D${i/2}</b> = 16#${hx(b<<8|a,4)} (Low=${hx(a)} High=${hx(b)})<br>`;
    }
    h+="</div>"+(bad?`<p class="bad" style="margin-top:8px">⚠ ASCII รองรับรหัส 0–127 เท่านั้น อักษรไทยหรืออักขระอื่นต้องใช้การเข้ารหัสแบบอื่น (ตารางนี้แทนด้วย ?)</p>`:"");
    $("#o").innerHTML=h;
  };
  $("#t").oninput=u;u();
  $("#gr").innerHTML=Array.from({length:95},(_,i)=>`<button>${String.fromCharCode(i+32)}</button>`).join("");
  $$("#gr button").forEach((b,i)=>b.onclick=()=>$("#gi").innerHTML=sh(i+32));
}

const STORE_KEY="plc_quiz_records";
const GSHEET_KEY="plc_gsheet_url";
// วาง URL ของ Google Apps Script Web App ที่นี่ (เมื่อ Deploy แล้ว) เพื่อให้ส่งคะแนนอัตโนมัติทุกคนที่เปิดลิงก์ GitHub
const DEFAULT_GSHEET_URL="https://script.google.com/macros/s/AKfycbwX8pMAx-41vyTWOaFTirdUXbWcGWYXkG5zi7bowy3js3pALbfa4lYTDlgx7JTnEmR1NQ/exec";
const getSheetUrl=()=>{try{return(localStorage.getItem(GSHEET_KEY)||DEFAULT_GSHEET_URL).trim()}catch{return DEFAULT_GSHEET_URL}};
const getRecords=()=>{try{return JSON.parse(localStorage.getItem(STORE_KEY)||"[]")}catch{return[]}};
const saveRecords=arr=>{try{localStorage.setItem(STORE_KEY,JSON.stringify(arr))}catch{}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const csvEsc=v=>`"${String(v??"").replace(/"/g,'""')}"`;
function exportCSV(records,filename="plc_quiz_scores.csv"){
  if(!records.length)return;
  const header=["ลำดับ","วัน-เวลา","ชื่อ-นามสกุล","รหัส/เลขที่","ประเภทการทดสอบ","คะแนน","เต็ม","ร้อยละ (%)"];
  const rows=records.map((r,idx)=>[idx+1,r.date,r.name,r.sid||"-",r.type,r.score,r.total,r.pct]);
  const csv="\uFEFF"+[header,...rows].map(row=>row.map(csvEsc).join(",")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function sendToSheet(rec){
  const url=getSheetUrl();
  if(!url)return{ok:false,reason:"not_configured"};
  try{
    await fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(rec)});
    return{ok:true};
  }catch(err){
    return{ok:false,reason:err.message||"network_error"};
  }
}
